schema_version: 1

context:
  version: "0.8.0"

package:
  name: tavily-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tavily-python/tavily_python-${{ version }}.tar.gz
  sha256: e9e440df828a70ea9c4390f27778dbdc051159406c9c903bad1e6d8dc7df2fc4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - tiktoken >=0.5.1
    - httpx

tests:
  - python:
      python_version:
        - ${{ python_min }}
        - '*'
      imports:
        - tavily
      pip_check: true

about:
  summary: Python wrapper for the Tavily API
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tavily-ai/tavily-python

extra:
  recipe-maintainers:
    - xhochy
